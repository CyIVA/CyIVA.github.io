<section id="tag-list" class="topic-section">
  <div class="categories">
    {% assign CATEGORY = "" | split: ',' %} 
    {% for post in site.posts %} 
        {% for c in post.categories %} 
            {% assign c_upper = c | upcase %}
            {% assign CATEGORY = CATEGORY | push: c_upper %} 
        {% endfor %} 
    {% endfor %}
    {% assign CATEGORYS = CATEGORY | uniq %}

    <a href="#!" data-base-url="{{site.baseurl}}" class="category active" data-category="ALL">
      ✨ ALL
    </a>
    {% for c in CATEGORYS %}
    <a href="#!" data-base-url="{{site.baseurl}}" class="category" data-category="{{c}}">
      {{c}} <span class="category_count"></span>
    </a>
    {% endfor %}

    <script>
      var js_categories = {{ CATEGORY | jsonify }}; 
      let categoryCounts = {};
      js_categories.forEach(category => {
        let key = category.trim().toUpperCase();
        if (!categoryCounts[key]) categoryCounts[key] = 0;
        categoryCounts[key]++;
      });

      const tagElements = document.querySelectorAll('#tag-list .category');
      tagElements.forEach(el => {
        let key = el.getAttribute('data-category');
        if (key && key !== "ALL") {
          let countSpan = el.querySelector('.category_count');
          if (countSpan) countSpan.innerText = categoryCounts[key] || 0;
        }
      });
    </script>
  </div>
</section>

<style>
/* Topic Tags */
.topic-section .categories {
  display: flex;
  flex-wrap: nowrap; /* Prevent tags from wrapping to new lines */
  gap: 0.75rem;
  overflow-x: auto;
  padding: 0.5rem 0;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch; /* Smooth scrolling on iOS */
}
.topic-section .categories::-webkit-scrollbar { display: none; }

.topic-section .category {
  flex-shrink: 0; /* Prevent tags from shrinking */
  background: var(--bg-200);
  border: 1px solid var(--border-color);
  color: var(--text-200);
  padding: 0.6rem 1.2rem;
  border-radius: 50px;
  font-size: 0.85rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  white-space: nowrap;
  transition: all 0.2s;
}
.topic-section .category:hover {
  background: var(--bg-300);
  color: var(--text-100);
}
.topic-section .category.active {
  background: var(--gradient-primary);
  color: white;
  border: none;
  box-shadow: 0 4px 12px rgba(58, 134, 255, 0.4);
}
.topic-section .category_count {
  font-size: 0.75rem;
  opacity: 0.7;
  background: rgba(255,255,255,0.1);
  padding: 2px 6px;
  border-radius: 10px;
}
</style>
