<div class="post-navigation-cards">
  {% if page.previous %}
  <a href="{{site.baseurl}}{{page.previous.url}}" class="nav-card prev-card">
    <span class="nav-direction">← PREVIOUS</span>
    <span class="nav-title">{{page.previous.title}}</span>
  </a>
  {% else %}
  <div class="nav-placeholder"></div>
  {% endif %}

  {% if page.next %}
  <a href="{{site.baseurl}}{{page.next.url}}" class="nav-card next-card">
    <span class="nav-direction">NEXT ARTICLE →</span>
    <span class="nav-title">{{page.next.title}}</span>
  </a>
  {% endif %}
</div>

<style>
.post-navigation-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  margin-top: 2rem;
}

.nav-card {
  background: var(--bg-200);
  border: 1px solid var(--border-color);
  padding: 1.5rem;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  transition: all 0.2s;
}

.nav-card:hover {
  background: var(--bg-300);
  border-color: var(--primary-100);
  transform: translateY(-2px);
}

.nav-direction {
  font-size: 0.7rem;
  font-weight: 800;
  color: var(--text-300);
  letter-spacing: 1px;
}

.nav-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-100);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.prev-card { text-align: left; }
.next-card { text-align: right; }

@media (max-width: 600px) {
  .post-navigation-cards {
    grid-template-columns: 1fr;
  }
}
</style>
